<!DOCTYPE html>

<html>
<head>
    <title>Student List</title>
    <style>
        table {
            border-collapse: separate;
            border-spacing: 0;
            width: 67%;
            margin: 0 auto;
        }
        th, td {
            text-align: center;
            padding: 8px;
        }
        th {
            background-color: #f2f2f2;
        }
        h1 {
            text-align: center;
        }
    </style>
</head>
<body>

<h1>Student List</h1>

{% if students %}

<table border="1" cellpadding="5">
    <tr>
        <th>Student ID</th>
        <th>Name</th>
        <th>Course</th>
        <th>Year Level</th>
    </tr>

    {% for student in students %}
    <tr>
        <td>{{ student.student_id }}</td>
        <td>{{ student.name }}</td>
        <td>{{ student.course }}</td>
        <td>{{ student.year_level }}</td>
    </tr>
    {% endfor %}

</table>

{% else %}

<p>No students found.</p>

{% endif %}

</body>
</html>
